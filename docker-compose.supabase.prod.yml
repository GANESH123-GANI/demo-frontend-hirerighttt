# Production: Supabase Auth + Postgres (no bundled database).
# Usage:
#   cp .env.production.example .env
#   # Set DATABASE_URL, SUPABASE_*, SESSION_SECRET, CORS_ORIGINS, EXPERIENTIALLABS_API_KEY
#   docker compose -f docker-compose.supabase.prod.yml up -d --build

services:
  api:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      NODE_ENV: production
      PORT: 8787
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres URI}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      ALLOW_DEMO_ACCOUNTS: ${ALLOW_DEMO_ACCOUNTS:-false}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EXPERIENTIALLABS_API_KEY: ${EXPERIENTIALLABS_API_KEY:?Set EXPERIENTIALLABS_API_KEY}
      OPENAI_API_KEY: ${EXPERIENTIALLABS_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.experientiallabs.ai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-supabase}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
