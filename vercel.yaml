# ==============================================================================
# HIRE RIGHT - VERCEL FRONTEND CONFIGURATION (YAML)
# ==============================================================================
# Note: Vercel natively reads `vercel.json` directly from the repository root.
# This YAML file matches `vercel.json` and can be used for reference or YAML CI/CD pipelines.
# ==============================================================================

version: 2
framework: vite
buildCommand: npm run build
outputDirectory: frontend/dist
cleanUrls: true

# SPA client-side routing fallback (prevents 404 on refresh for React Router routes)
rewrites:
  - source: /(.*)
    destination: /index.html

# Cache headers for static assets
headers:
  - source: /assets/(.*)
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
